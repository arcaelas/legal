<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arcaelas — Legal</title>
  <style>
    :root { --brand: #0746C5; --bg: #fafafa; --fg: #171717; --muted: #525252; --line: #e5e5e5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
    h1 { font-size: 32px; margin: 0 0 8px; letter-spacing: -0.5px; }
    p { color: var(--muted); margin: 0 0 16px; }
    ul.apps { list-style: none; padding: 0; margin: 32px 0 0; }
    .app { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
    .app h2 { margin: 0 0 4px; font-size: 20px; }
    .app .desc { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .links a { color: var(--brand); text-decoration: none; border: 1px solid var(--line); padding: 6px 12px; border-radius: 9999px; font-size: 13px; font-weight: 600; }
    .links a:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
    footer { color: var(--muted); font-size: 12px; margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <h1>Arcaelas Legal</h1>
    <p>Páginas legales públicas de las apps publicadas por Arcaelas.</p>

    <ul class="apps">
      <li class="app">
        <h2>Bolsillito</h2>
        <p class="desc">Local-first personal expense tracker.</p>
        <div class="links">
          <a href="bolsillito/privacy/">Privacy</a>
          <a href="bolsillito/polices/">Terms</a>
          <a href="bolsillito/deletion/">Data deletion</a>
        </div>
      </li>
    </ul>

    <footer>
      © 2026 Arcaelas — <a href="mailto:arenas782@gmail.com" style="color: var(--brand)">arenas782@gmail.com</a>
    </footer>
  </main>
</body>
</html>
